<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Linux Console</title>

    <link
      rel="stylesheet"
      href="/vendor/xterm.css"
    />

    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <div id="login-overlay">
      <div id="login-box">
        <div class="dialog-kicker">TermCloud</div>
        <h2>Web Linux Console</h2>
        <form id="login-form" onsubmit="handleLogin(event)">
          <label for="login-username">用户名</label>
          <input type="text" id="login-username" autocomplete="username" required />
          <label for="login-password">密码</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
          <button type="submit">登 录</button>
        </form>
        <div id="login-error"></div>
      </div>
    </div>

    <div id="claude-config-overlay" style="display:none">
      <div id="claude-config-box">
        <div class="dialog-kicker">运行环境</div>
        <h2>Claude Code 配置</h2>
        <form id="claude-config-form" onsubmit="handleClaudeConfig(event)">
          <label for="cc-base-url">ANTHROPIC_BASE_URL <span class="required">*</span></label>
          <input type="text" id="cc-base-url" value="https://api.poe.com" required />
          <label for="cc-auth-token">ANTHROPIC_AUTH_TOKEN <span class="required">*</span></label>
          <input type="password" id="cc-auth-token" placeholder="输入 Auth Token" required />
          <label for="cc-model">ANTHROPIC_MODEL</label>
          <select id="cc-model">
            <option value="">-- 不设置 --</option>
            <option value="deepseek-v4-pro[1m]">deepseek-v4-pro[1m]</option>
          </select>
          <label for="cc-haiku-model">ANTHROPIC_DEFAULT_HAIKU_MODEL</label>
          <select id="cc-haiku-model">
            <option value="">-- 不设置 --</option>
            <option value="deepseek-v4-flash">deepseek-v4-flash</option>
          </select>
          <label for="cc-effort">CLAUDE_CODE_EFFORT_LEVEL</label>
          <select id="cc-effort">
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max" selected>max</option>
          </select>
          <button type="submit">保存并进入</button>
          <button type="button" class="poe-skip-btn" onclick="skipClaudeConfig()">跳过</button>
        </form>
        <div id="claude-config-error"></div>
      </div>
    </div>

    <div id="plugin-overlay" style="display:none">
      <div id="plugin-box">
        <div class="dialog-kicker">扩展</div>
        <h2>插件安装</h2>
        <div class="plugin-item">
          <div class="plugin-info">
            <span class="plugin-name">Claude Code</span>
            <span class="plugin-desc">Anthropic 官方 CLI 工具</span>
          </div>
          <button class="plugin-install-action" data-cmd="npm install -g @anthropic-ai/claude-code">安装</button>
        </div>
        <button type="button" class="plugin-close-btn" onclick="closePluginOverlay()">关闭</button>
      </div>
    </div>

    <div id="app-container" style="display:none">
      <div id="sidebar">
        <div id="sidebar-titlebar">
          <div class="brand-mark">TC</div>
          <div class="brand-copy">
            <span class="brand-name">TermCloud</span>
            <span class="brand-subtitle">Web Linux Console</span>
          </div>
        </div>
        <div id="sidebar-header">
          <div class="path-stack">
            <span class="section-label">文件</span>
            <span class="path-text" id="current-path">/</span>
          </div>
          <button id="refresh-btn" title="刷新文件列表" aria-label="刷新文件列表">⟳</button>
        </div>
        <div id="file-list">
          <div class="file-list-loading">加载中...</div>
        </div>
        <div id="sidebar-footer">
          <button id="claude-config-btn" title="配置 Claude Code">⚙ Claude Code 配置</button>
          <button id="plugin-install-btn" title="安装插件">▣ 插件安装</button>
        </div>

      </div>

      <div id="main-area">
        <div id="workspace-topbar">
          <div class="terminal-title">
            <span class="terminal-glyph">⌁</span>
            <span>终端</span>
          </div>
          <div id="connection-status" class="connection-status is-idle">
            <span class="status-dot"></span>
            <span id="connection-status-text">未连接</span>
          </div>
        </div>
        <div id="terminal-panel">
          <div id="terminal"></div>
        </div>
      </div>
    </div>

    <script defer src="/vendor/xterm.js"></script>
    <script defer src="/vendor/addon-fit.js"></script>
    <script defer src="/vendor/addon-unicode11.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
      // ── auth helpers ──
      function getToken() {
        return localStorage.getItem("token");
      }

      function setToken(token) {
        localStorage.setItem("token", token);
      }

      function clearToken() {
        localStorage.removeItem("token");
      }

      function showLogin() {
        document.getElementById("login-overlay").style.display = "flex";
        document.getElementById("claude-config-overlay").style.display = "none";
        document.getElementById("app-container").style.display = "none";
      }

      function showClaudeConfig() {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("claude-config-overlay").style.display = "flex";
        document.getElementById("app-container").style.display = "none";
        document.getElementById("cc-base-url").focus();
      }

      document.getElementById("claude-config-btn").addEventListener("click", function () {
        document.getElementById("claude-config-overlay").style.display = "flex";
        document.getElementById("app-container").style.display = "none";
        document.getElementById("claude-config-error").textContent = "";
        fetchWithAuth("/api/claude-config").then(r => r.json()).then(data => {
          if (data.baseUrl) document.getElementById("cc-base-url").value = data.baseUrl;
          if (data.authToken) document.getElementById("cc-auth-token").value = data.authToken;
          if (data.model) document.getElementById("cc-model").value = data.model;
          else document.getElementById("cc-model").value = "";
          if (data.haikuModel) document.getElementById("cc-haiku-model").value = data.haikuModel;
          else document.getElementById("cc-haiku-model").value = "";
          if (data.effort) document.getElementById("cc-effort").value = data.effort;
        }).catch(() => {});
        document.getElementById("cc-base-url").focus();
      });

      document.getElementById("plugin-install-btn").addEventListener("click", function () {
        document.getElementById("plugin-overlay").style.display = "flex";
      });

      window.closePluginOverlay = function () {
        document.getElementById("plugin-overlay").style.display = "none";
      };

      document.querySelectorAll(".plugin-install-action").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var cmd = this.getAttribute("data-cmd");
          if (!cmd || !socket || socket.readyState !== WebSocket.OPEN) return;
          var payload = textEncoder.encode(cmd + "\n");
          var frame = new Uint8Array(1 + payload.length);
          frame[0] = MSG_INPUT;
          frame.set(payload, 1);
          socket.send(frame.buffer);
          document.getElementById("plugin-overlay").style.display = "none";
        });
      });

      let pendingCmd = null;

      function setConnectionStatus(text, state) {
        const status = document.getElementById("connection-status");
        const label = document.getElementById("connection-status-text");
        if (!status || !label) return;
        status.className = `connection-status is-${state}`;
        label.textContent = text;
      }

      function sendToTerminal(cmd) {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        var payload = textEncoder.encode(cmd + "\n");
        var frame = new Uint8Array(1 + payload.length);
        frame[0] = MSG_INPUT;
        frame.set(payload, 1);
        socket.send(frame.buffer);
      }

      function showApp() {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("claude-config-overlay").style.display = "none";
        document.getElementById("app-container").style.display = "flex";
        initTerminal();
        loadFiles("");
      }

      window.handleLogin = function (event) {
        event.preventDefault();
        const username = document.getElementById("login-username").value;
        const password = document.getElementById("login-password").value;
        const errorEl = document.getElementById("login-error");
        errorEl.textContent = "";

        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.token) {
              setToken(data.token);
              if (!data.claudeConfigured) {
                showClaudeConfig();
              } else {
                showApp();
              }
            } else {
              errorEl.textContent = data.error || "登录失败";
            }
          })
          .catch(() => {
            errorEl.textContent = "网络错误";
          });
      }

      window.handleClaudeConfig = function (event) {
        event.preventDefault();
        const baseUrl = document.getElementById("cc-base-url").value.trim();
        const authToken = document.getElementById("cc-auth-token").value.trim();
        const model = document.getElementById("cc-model").value.trim();
        const haikuModel = document.getElementById("cc-haiku-model").value.trim();
        const effort = document.getElementById("cc-effort").value.trim();
        const errorEl = document.getElementById("claude-config-error");
        errorEl.textContent = "";

        fetchWithAuth("/api/claude-config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ baseUrl, authToken, model, haikuModel, effort })
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.ok) {
              pendingCmd = "source ~/.bashrc";
              showApp();
              if (socket && socket.readyState === WebSocket.OPEN) {
                setTimeout(() => { sendToTerminal(pendingCmd); pendingCmd = null; }, 500);
              }
            } else {
              errorEl.textContent = data.error || "保存失败";
            }
          })
          .catch(() => {
            errorEl.textContent = "网络错误";
          });
      }

      window.skipClaudeConfig = function () {
        showApp();
      }

      function fetchWithAuth(url, options) {
        const token = getToken();
        const headers = Object.assign({}, options && options.headers, {
          Authorization: "Bearer " + token
        });
        return fetch(url, Object.assign({}, options, { headers })).then((r) => {
          if (r.status === 401) {
            clearToken();
            showLogin();
            throw new Error("unauthorized");
          }
          return r;
        });
      }

      // ── terminal setup ──
      const MSG_OUTPUT = 0x01;
      const MSG_INPUT = 0x02;
      const MSG_RESIZE = 0x03;
      const MSG_CONNECTED = 0x04;
      const MSG_BATCH_OUTPUT = 0x05;

      let terminalInitialized = false;
      let socket = null;
      const terminalFontFamily = '"TermMono", monospace';
      const textDecoder = new TextDecoder();
      const textEncoder = new TextEncoder();

      // write batching: collect output and flush once per animation frame
      let writeBuffer = [];
      let writeFlushScheduled = false;

      function flushWriteBuffer() {
        if (writeBuffer.length > 0) {
          terminal.write(writeBuffer.join(""));
          writeBuffer = [];
        }
        writeFlushScheduled = false;
      }

      function pushOutput(data) {
        writeBuffer.push(data);
        if (!writeFlushScheduled) {
          writeFlushScheduled = true;
          requestAnimationFrame(flushWriteBuffer);
        }
      }

      const terminal = new Terminal({
        allowProposedApi: true,
        cursorBlink: true,
        fontSize: 14,
        fontFamily: terminalFontFamily,
        letterSpacing: 0,
        lineHeight: 1.2,
        rescaleOverlappingGlyphs: true,
        scrollback: 5000,
        theme: {
          background: "#111111"
        }
      });

      const fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);
      if (window.Unicode11Addon) {
        terminal.loadAddon(new Unicode11Addon.Unicode11Addon());
        terminal.unicode.activeVersion = "11";
      }

      function initTerminal() {
        if (terminalInitialized) return;
        terminalInitialized = true;

        terminal.open(document.getElementById("terminal"));
        fitAddon.fit();
        terminal.focus();
        refitTerminalAfterFontsLoad();

        connectWebSocket();
      }

      function connectWebSocket() {
        setConnectionStatus("连接中", "connecting");
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const token = getToken();
        socket = new WebSocket(
          `${protocol}//${location.host}/ws/terminal?token=${token}`
        );
        socket.binaryType = "arraybuffer";

        socket.onopen = () => {
          setConnectionStatus("已连接", "connected");
          const dims = fitAddon.proposeDimensions();
          if (dims) {
            sendResize(dims.cols, dims.rows);
          }
          if (pendingCmd) {
            setTimeout(() => { sendToTerminal(pendingCmd); pendingCmd = null; }, 500);
          }
        };

        socket.onmessage = (event) => {
          const view = new Uint8Array(event.data);
          if (view.length < 1) return;
          const msgType = view[0];
          const payload = textDecoder.decode(view.subarray(1));

          if (msgType === MSG_CONNECTED) {
            const resuming = view.length > 1 && view[1] === 0x01;
            if (!resuming) {
              terminal.writeln("Connected to Linux server\r\n");
            }
            return;
          }

          if (msgType === MSG_OUTPUT || msgType === MSG_BATCH_OUTPUT) {
            pushOutput(payload);
          }
        };

        socket.onclose = (event) => {
          if (event.code === 4001 || event.code === 4003) {
            setConnectionStatus("未连接", "idle");
            clearToken();
            showLogin();
          } else {
            setConnectionStatus("重连中", "connecting");
            terminal.writeln("\r\nConnection lost, reconnecting...");
            setTimeout(() => {
              if (getToken()) connectWebSocket();
            }, 2000);
          }
        };

        socket.onerror = () => {
          setConnectionStatus("连接错误", "error");
          terminal.writeln("\r\nConnection error");
        };
      }

      // Register once — not inside connectWebSocket, to avoid listener accumulation on reconnection
      terminal.onData((data) => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          const payload = textEncoder.encode(data);
          const frame = new Uint8Array(1 + payload.length);
          frame[0] = MSG_INPUT;
          frame.set(payload, 1);
          socket.send(frame.buffer);
        }
      });

      function sendResize(cols, rows) {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        const frame = new Uint8Array([MSG_RESIZE, cols & 0xFF, cols >> 8, rows & 0xFF, rows >> 8]);
        socket.send(frame.buffer);
      }

      function fitTerminal() {
        fitAddon.fit();
        const dims = fitAddon.proposeDimensions();
        if (dims) {
          sendResize(dims.cols, dims.rows);
        }
      }

      function refitTerminalAfterFontsLoad() {
        if (!document.fonts || !document.fonts.load) {
          return;
        }

        // Force-activate both unicode-range @font-face blocks for "TermMono"
        // before xterm.js measures the cell width, so the CJK @font-face
        // takes effect from the first render.
        const probes = [
          document.fonts.load('14px "TermMono"', "Aa"),
          document.fonts.load('14px "TermMono"', "中，。：（）")
        ];

        Promise.allSettled(probes).then(() => {
          fitTerminal();
          terminal.refresh(0, terminal.rows - 1);
        });
      }

      window.addEventListener("resize", fitTerminal);

      document.getElementById("refresh-btn").addEventListener("click", refreshFiles);

      // ── file browser ──
      let currentDir = "";
      let loadFilesAbort = null;

      function loadFiles(dir) {
        if (loadFilesAbort) loadFilesAbort.abort();
        loadFilesAbort = new AbortController();
        const { signal } = loadFilesAbort;

        const listEl = document.getElementById("file-list");
        listEl.innerHTML = '<div class="file-list-loading">加载中...</div>';

        fetchWithAuth(`/api/files?dir=${encodeURIComponent(dir)}`, { signal })
          .then((r) => r.json())
          .then((data) => {
            currentDir = data.dir;
            document.getElementById("current-path").textContent = data.dir;

            const fragment = document.createDocumentFragment();

            if (data.dir !== data.workDir) {
              fragment.appendChild(createFileItemParent(pathDir(data.dir)));
            }

            const sorted = data.entries.sort((a, b) => {
              if (a.isDirectory !== b.isDirectory)
                return a.isDirectory ? -1 : 1;
              return a.name.localeCompare(b.name);
            });

            for (const entry of sorted) {
              const fullPath = `${data.dir}/${entry.name}`.replace(/\/+/g, "/");
              fragment.appendChild(createFileItem(entry, fullPath, data.dir));
            }

            listEl.replaceChildren(fragment.hasChildNodes() ? fragment : createEmptyMessage("空目录"));
          })
          .catch((err) => {
            if (err.name === "AbortError") return;
            listEl.replaceChildren(createEmptyMessage("加载失败"));
          });
      }

      function createEmptyMessage(text) {
        const div = document.createElement("div");
        div.className = "file-list-loading";
        div.textContent = text;
        return div;
      }

      function createFileItemParent(parentDir) {
        const item = document.createElement("div");
        item.className = "file-item is-parent";
        item.innerHTML = '<span class="icon">↰</span><span class="name">..</span>';
        item.addEventListener("click", () => navigateTo(parentDir));
        return item;
      }

      function createFileItem(entry, fullPath, parentDir) {
        const item = document.createElement("div");
        item.className = `file-item ${entry.isDirectory ? "is-dir" : "is-file"}`;

        const icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = entry.isDirectory ? "▸" : "•";
        item.appendChild(icon);

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = entry.name;
        item.appendChild(name);

        if (entry.isDirectory) {
          item.addEventListener("click", () => navigateTo(fullPath));
        } else {
          item.addEventListener("click", () => navigateTo(pathDir(fullPath)));

          const meta = document.createElement("span");
          meta.className = "file-meta";
          meta.textContent = formatBytes(entry.size);
          item.appendChild(meta);

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-btn";
          deleteBtn.title = "删除";
          deleteBtn.textContent = "✕";
          deleteBtn.addEventListener("click", (e) => { e.stopPropagation(); deleteItem(fullPath); });
          item.appendChild(deleteBtn);

          const downloadBtn = document.createElement("button");
          downloadBtn.className = "download-btn";
          downloadBtn.title = "下载";
          downloadBtn.textContent = "⬇";
          downloadBtn.addEventListener("click", (e) => { e.stopPropagation(); downloadItem(fullPath); });
          item.appendChild(downloadBtn);
        }

        return item;
      }

      function formatBytes(bytes) {
        if (!Number.isFinite(bytes) || bytes < 0) return "";
        if (bytes < 1024) return `${bytes} B`;
        const units = ["KB", "MB", "GB", "TB"];
        let value = bytes / 1024;
        let unit = units[0];
        for (let i = 1; i < units.length && value >= 1024; i++) {
          value /= 1024;
          unit = units[i];
        }
        return `${value >= 10 ? value.toFixed(0) : value.toFixed(1)} ${unit}`;
      }

      function navigateTo(dir) {
        loadFiles(dir);
      }

      function refreshFiles() {
        loadFiles(currentDir);
      }

      function downloadItem(fullPath) {
        const a = document.createElement("a");
        a.href = `/download?path=${encodeURIComponent(fullPath)}&token=${encodeURIComponent(getToken())}`;
        a.download = fullPath.split("/").pop();
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      function deleteItem(fullPath) {
        const name = fullPath.split("/").pop();
        if (!confirm(`确定删除 ${name} 吗？`)) return;
        fetchWithAuth(`/api/files?path=${encodeURIComponent(fullPath)}`, { method: "DELETE" })
          .then((r) => {
            if (!r.ok) return r.json().then((e) => { throw new Error(e.error); });
            loadFiles(currentDir);
          })
          .catch((err) => {
            alert("删除失败: " + err.message);
          });
      }

      function pathDir(fullPath) {
        const idx = fullPath.lastIndexOf("/");
        return idx > 0 ? fullPath.substring(0, idx) : "/";
      }

      // ── startup: check existing token ──
      (function () {
        const token = getToken();
        if (token) {
          fetchWithAuth("/api/claude-config")
            .then((r) => r.json())
            .then((data) => {
              if (data.configured) {
                showApp();
              } else {
                showClaudeConfig();
              }
            })
            .catch(() => showLogin());
        } else {
          showLogin();
        }
      })();

      }); // end DOMContentLoaded
    </script>
  </body>
</html>
