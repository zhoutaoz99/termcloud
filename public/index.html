<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Linux Console</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm/css/xterm.css"
    />

    <style>
      /* Split ASCII and CJK/fullwidth into separate font sources via unicode-range,
         so per-character fallback can no longer pick a Western font for CJK
         punctuation and render it at the wrong width (which misaligns markdown
         tables in xterm.js). */
      @font-face {
        font-family: "TermMono";
        src: local("ui-monospace"), local("SFMono-Regular"), local("SF Mono"),
             local("Menlo"), local("Monaco"), local("Consolas"),
             local("Liberation Mono"), local("DejaVu Sans Mono");
        unicode-range: U+0000-024F, U+2000-22FF;
      }
      @font-face {
        font-family: "TermMono";
        /* Self-hosted Sarasa Fixed SC (GB 2312 subset, ~970 KB woff2). Sarasa Fixed
           forces CJK glyphs to be exactly 2× ASCII width, so markdown tables stay
           aligned regardless of which CJK fonts the visitor has installed. The
           local() chain is fallback when the woff2 fails to load or is still
           in-flight. font-display:swap shows fallback glyphs immediately so the
           initial paint isn't blocked on the font download. */
        src: url("/fonts/sarasa-fixed-sc-regular.woff2") format("woff2"),
             local("Sarasa Fixed SC"), local("Sarasa Mono SC"),
             local("Noto Sans Mono CJK SC"), local("Source Han Mono SC"),
             local("PingFang SC"), local("Hiragino Sans GB"),
             local("Microsoft YaHei"), local("SimHei"), local("SimSun"),
             local("WenQuanYi Micro Hei Mono");
        unicode-range: U+2E80-9FFF, U+3000-303F, U+FF00-FFEF, U+3400-4DBF;
        font-display: swap;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #111;
        font-family: sans-serif;
        overflow: hidden;
      }

      /* ── login overlay ── */
      #login-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      #login-box {
        background: #1a1a2e;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 36px 32px;
        width: 340px;
        box-sizing: border-box;
      }

      #login-box h2 {
        margin: 0 0 24px;
        color: #ddd;
        font-size: 20px;
        text-align: center;
        font-weight: 500;
      }

      #login-box label {
        display: block;
        color: #aaa;
        font-size: 13px;
        margin-bottom: 4px;
      }

      #login-box input[type="text"],
      #login-box input[type="password"] {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 16px;
        border: 1px solid #333;
        border-radius: 4px;
        background: #0e0e1a;
        color: #ddd;
        font-size: 14px;
        box-sizing: border-box;
        outline: none;
      }

      #login-box input[type="text"]:focus,
      #login-box input[type="password"]:focus {
        border-color: #0f3460;
      }

      #login-box button[type="submit"] {
        width: 100%;
        padding: 10px;
        background: #0f3460;
        border: none;
        border-radius: 4px;
        color: #ddd;
        font-size: 14px;
        cursor: pointer;
        margin-top: 4px;
      }

      #login-box button[type="submit"]:hover {
        background: #1a4a8a;
      }

      #login-error {
        color: #e74c3c;
        font-size: 13px;
        text-align: center;
        margin-top: 12px;
        min-height: 18px;
      }

      #app-container {
        display: flex;
        width: 100%;
        height: 100%;
      }

      /* ── sidebar ── */
      #sidebar {
        width: 260px;
        min-width: 0;
        background: #1a1a2e;
        color: #ccc;
        display: flex;
        flex-direction: column;
        transition: width 0.25s ease;
        overflow: hidden;
        border-right: 1px solid #333;
      }

      #sidebar.hidden {
        width: 0;
        border-right: none;
      }

      #sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        background: #16213e;
        flex-shrink: 0;
      }

      #sidebar-header .path-text {
        font-size: 12px;
        color: #aaa;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }

      #sidebar-header button {
        background: none;
        border: none;
        color: #aaa;
        cursor: pointer;
        font-size: 16px;
        padding: 0 4px;
        line-height: 1;
      }

      #sidebar-header button:hover {
        color: #fff;
      }

      #file-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }

      #file-list::-webkit-scrollbar {
        width: 5px;
      }

      #file-list::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 3px;
      }

      .file-item {
        display: flex;
        align-items: center;
        padding: 6px 10px;
        cursor: pointer;
        gap: 8px;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .file-item:hover {
        background: #0f3460;
      }

      .file-item .icon {
        flex-shrink: 0;
        width: 18px;
        text-align: center;
        font-size: 14px;
      }

      .file-item .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .file-item .download-btn {
        flex-shrink: 0;
        background: none;
        border: none;
        color: #5fa8d3;
        cursor: pointer;
        font-size: 15px;
        padding: 0 2px;
        opacity: 0;
        transition: opacity 0.15s;
      }

      .file-item:hover .download-btn {
        opacity: 1;
      }

      .file-item .download-btn:hover {
        color: #7ec8e3;
      }

      /* manual path input at bottom of sidebar */
      #sidebar-footer {
        display: flex;
        gap: 6px;
        padding: 8px 10px;
        background: #16213e;
        flex-shrink: 0;
        border-top: 1px solid #333;
      }

      #sidebar-footer input {
        flex: 1;
        padding: 4px 8px;
        border: 1px solid #333;
        border-radius: 3px;
        background: #0e0e1a;
        color: #ccc;
        font-size: 12px;
        min-width: 0;
      }

      #sidebar-footer button {
        padding: 4px 10px;
        background: #0f3460;
        border: none;
        border-radius: 3px;
        color: #ddd;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
      }

      #sidebar-footer button:hover {
        background: #1a4a8a;
      }

      /* ── main area ── */
      #main-area {
        flex: 1;
        display: flex;
        position: relative;
        min-width: 0;
      }

      #toggle-btn {
        position: absolute;
        left: 4px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        background: #1a1a2e;
        border: 1px solid #333;
        border-left: none;
        border-radius: 0 4px 4px 0;
        color: #aaa;
        cursor: pointer;
        font-size: 14px;
        padding: 8px 5px;
        display: none;
        transition: color 0.15s;
      }

      #toggle-btn:hover {
        color: #fff;
      }

      #sidebar.hidden ~ #main-area #toggle-btn {
        display: block;
      }

      #terminal {
        width: 100%;
        height: 100%;
        font-variant-ligatures: none;
        font-feature-settings:
          "liga" 0,
          "calt" 0;
      }

      #terminal .xterm,
      #terminal .xterm-rows {
        font-variant-ligatures: none;
        font-feature-settings:
          "liga" 0,
          "calt" 0;
      }

      /* loading state */
      .file-list-loading {
        text-align: center;
        padding: 20px;
        color: #555;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div id="login-overlay">
      <div id="login-box">
        <h2>Web Linux Console</h2>
        <form id="login-form" onsubmit="handleLogin(event)">
          <label for="login-username">用户名</label>
          <input type="text" id="login-username" autocomplete="username" required />
          <label for="login-password">密码</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
          <button type="submit">登 录</button>
        </form>
        <div id="login-error"></div>
      </div>
    </div>

    <div id="app-container" style="display:none">
      <div id="sidebar">
        <div id="sidebar-header">
          <span class="path-text" id="current-path">/</span>
          <button onclick="toggleSidebar()" title="隐藏侧栏">◀</button>
        </div>
        <div id="file-list">
          <div class="file-list-loading">加载中...</div>
        </div>
        <div id="sidebar-footer">
          <input id="filePath" placeholder="输入路径下载文件" />
          <button onclick="downloadFile()">下载</button>
        </div>
      </div>

      <div id="main-area">
        <button id="toggle-btn" onclick="toggleSidebar()" title="显示文件栏">▶</button>
        <div id="terminal"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>

    <script>
      // ── auth helpers ──
      function getToken() {
        return localStorage.getItem("token");
      }

      function setToken(token) {
        localStorage.setItem("token", token);
      }

      function clearToken() {
        localStorage.removeItem("token");
      }

      function showLogin() {
        document.getElementById("login-overlay").style.display = "flex";
        document.getElementById("app-container").style.display = "none";
      }

      function showApp() {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("app-container").style.display = "flex";
        initTerminal();
        loadFiles("");
      }

      function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById("login-username").value;
        const password = document.getElementById("login-password").value;
        const errorEl = document.getElementById("login-error");
        errorEl.textContent = "";

        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.token) {
              setToken(data.token);
              showApp();
            } else {
              errorEl.textContent = data.error || "登录失败";
            }
          })
          .catch(() => {
            errorEl.textContent = "网络错误";
          });
      }

      function fetchWithAuth(url, options) {
        const token = getToken();
        const headers = Object.assign({}, options && options.headers, {
          Authorization: "Bearer " + token
        });
        return fetch(url, Object.assign({}, options, { headers })).then((r) => {
          if (r.status === 401) {
            clearToken();
            showLogin();
            throw new Error("unauthorized");
          }
          return r;
        });
      }

      // ── terminal setup ──
      let terminalInitialized = false;
      let socket = null;
      const terminalFontFamily = '"TermMono", monospace';

      const terminal = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: terminalFontFamily,
        letterSpacing: 0,
        lineHeight: 1.2,
        rescaleOverlappingGlyphs: true,
        scrollback: 5000,
        theme: {
          background: "#111111"
        }
      });

      const fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);
      if (window.Unicode11Addon) {
        terminal.loadAddon(new Unicode11Addon.Unicode11Addon());
        terminal.unicode.activeVersion = "11";
      }

      function initTerminal() {
        if (terminalInitialized) return;
        terminalInitialized = true;

        terminal.open(document.getElementById("terminal"));
        fitAddon.fit();
        terminal.focus();
        refitTerminalAfterFontsLoad();

        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const token = getToken();
        socket = new WebSocket(
          `${protocol}//${location.host}/ws/terminal?token=${token}`
        );

        socket.onopen = () => {
          terminal.writeln("Connected to Linux server\r\n");

          const dims = fitAddon.proposeDimensions();
          if (dims) {
            socket.send(
              JSON.stringify({
                type: "resize",
                cols: dims.cols,
                rows: dims.rows
              })
            );
          }
        };

        let pendingAnsiFragment = "";
        let pendingCursorHome = "";
        let justPreservedClear = false;

        socket.onmessage = (event) => {
          const msg = JSON.parse(event.data);

          if (msg.type === "output") {
            const data = preserveClearScreenOutput(msg.data);
            if (data) {
              terminal.write(data);
            }
          }
        };

        socket.onclose = (event) => {
          if (event.code === 4001 || event.code === 4003) {
            clearToken();
            showLogin();
          } else {
            terminal.writeln("\r\nConnection closed");
          }
        };

        socket.onerror = () => {
          terminal.writeln("\r\nConnection error");
        };

        terminal.onData((data) => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(
              JSON.stringify({
                type: "input",
                data
              })
            );
          }
        });

        function preserveClearScreenOutput(data) {
          const input = pendingAnsiFragment + data;
          pendingAnsiFragment = "";

          const output = [];
          let index = 0;

          function flushPendingCursorHome() {
            if (pendingCursorHome) {
              output.push(pendingCursorHome);
              pendingCursorHome = "";
            }
          }

          function appendText(text) {
            if (!text) {
              return;
            }
            flushPendingCursorHome();
            justPreservedClear = false;
            output.push(text);
          }

          function appendClearBoundary() {
            output.push("\r\n");
          }

          while (index < input.length) {
            const escapeIndex = input.indexOf("\x1b", index);

            if (escapeIndex === -1) {
              appendText(input.slice(index));
              break;
            }

            appendText(input.slice(index, escapeIndex));

            const sequence = readAnsiSequence(input, escapeIndex);
            if (!sequence) {
              pendingAnsiFragment = input.slice(escapeIndex);
              break;
            }

            if (isCursorHome(sequence)) {
              if (!justPreservedClear) {
                flushPendingCursorHome();
                pendingCursorHome = sequence;
              }
            } else if (isFullScreenClear(sequence)) {
              pendingCursorHome = "";
              if (!justPreservedClear) {
                appendClearBoundary();
                justPreservedClear = true;
              }
            } else if (isScrollbackClear(sequence)) {
              pendingCursorHome = "";
            } else {
              flushPendingCursorHome();
              output.push(sequence);
            }

            index = escapeIndex + sequence.length;
          }

          return output.join("");
        }

        function readAnsiSequence(input, index) {
          if (index + 1 >= input.length) {
            return null;
          }

          const type = input[index + 1];

          if (type === "[") {
            for (let i = index + 2; i < input.length; i += 1) {
              const code = input.charCodeAt(i);
              if (code >= 0x40 && code <= 0x7e) {
                return input.slice(index, i + 1);
              }
            }
            return null;
          }

          if (type === "]") {
            for (let i = index + 2; i < input.length; i += 1) {
              if (input.charCodeAt(i) === 0x07) {
                return input.slice(index, i + 1);
              }
              if (input[i] === "\x1b" && input[i + 1] === "\\") {
                return input.slice(index, i + 2);
              }
            }
            return null;
          }

          if (type === "P" || type === "^" || type === "_") {
            for (let i = index + 2; i < input.length; i += 1) {
              if (input[i] === "\x1b" && input[i + 1] === "\\") {
                return input.slice(index, i + 2);
              }
            }
            return null;
          }

          for (let i = index + 1; i < input.length; i += 1) {
            const code = input.charCodeAt(i);
            if (code >= 0x30 && code <= 0x7e) {
              return input.slice(index, i + 1);
            }
            if (code < 0x20 || code > 0x2f) {
              return input.slice(index, i + 1);
            }
          }

          return null;
        }

        function getCsi(sequence) {
          if (!sequence.startsWith("\x1b[")) {
            return null;
          }

          return {
            final: sequence[sequence.length - 1],
            params: sequence.slice(2, -1)
          };
        }

        function isCursorHome(sequence) {
          const csi = getCsi(sequence);
          if (!csi || (csi.final !== "H" && csi.final !== "f")) {
            return false;
          }

          const parts = csi.params.split(";");
          const row = parts[0] || "1";
          const col = parts[1] || "1";
          return (parts.length === 1 || parts.length === 2) && row === "1" && col === "1";
        }

        function isFullScreenClear(sequence) {
          const csi = getCsi(sequence);
          return csi?.final === "J" && csi.params === "2";
        }

        function isScrollbackClear(sequence) {
          const csi = getCsi(sequence);
          return csi?.final === "J" && csi.params === "3";
        }
      }

      function fitTerminal() {
        fitAddon.fit();
        const dims = fitAddon.proposeDimensions();
        if (dims && socket && socket.readyState === WebSocket.OPEN) {
          socket.send(
            JSON.stringify({
              type: "resize",
              cols: dims.cols,
              rows: dims.rows
            })
          );
        }
      }

      function refitTerminalAfterFontsLoad() {
        if (!document.fonts || !document.fonts.load) {
          return;
        }

        // Force-activate the ASCII and CJK ranges of "TermMono" so the
        // self-hosted woff2 (~970 KB) finishes downloading before xterm.js
        // measures the cell width. Without this probe the woff2 stays lazy
        // until the first CJK character is rendered, and the font swap that
        // happens mid-session leaves cell metrics out of date.
        const probes = [
          document.fonts.load('14px "TermMono"', "Aa"),
          document.fonts.load('14px "TermMono"', "中，。：（）")
        ];

        Promise.allSettled(probes).then(() => {
          fitTerminal();
          terminal.refresh(0, terminal.rows - 1);
        });
      }

      window.addEventListener("resize", fitTerminal);

      // ── sidebar toggle ──
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("hidden");
        // refit terminal after transition
        setTimeout(fitTerminal, 300);
      }

      // ── file browser ──
      let currentDir = "";

      function loadFiles(dir) {
        const listEl = document.getElementById("file-list");
        listEl.innerHTML = '<div class="file-list-loading">加载中...</div>';

        fetchWithAuth(`/api/files?dir=${encodeURIComponent(dir)}`)
          .then((r) => r.json())
          .then((data) => {
            currentDir = data.dir;
            document.getElementById("current-path").textContent = data.dir;

            let html = "";

            // parent directory entry
            if (data.dir !== "/") {
              html += `<div class="file-item" onclick="navigateTo('${escapeJs(data.dir)}/..')">
                <span class="icon">📁</span>
                <span class="name">..</span>
                <span></span>
              </div>`;
            }

            // sort: directories first, then files
            const sorted = data.entries.sort((a, b) => {
              if (a.isDirectory !== b.isDirectory)
                return a.isDirectory ? -1 : 1;
              return a.name.localeCompare(b.name);
            });

            for (const entry of sorted) {
              if (entry.isDirectory) {
                const fullPath = `${data.dir}/${entry.name}`.replace(/\/+/g, "/");
                html += `<div class="file-item" onclick="navigateTo('${escapeJs(fullPath)}')">
                  <span class="icon">📁</span>
                  <span class="name">${escapeHtml(entry.name)}</span>
                  <span></span>
                </div>`;
              } else {
                const fullPath = `${data.dir}/${entry.name}`.replace(/\/+/g, "/");
                html += `<div class="file-item" onclick="navigateTo('${escapeJs(pathDir(fullPath))}')">
                  <span class="icon">📄</span>
                  <span class="name">${escapeHtml(entry.name)}</span>
                  <button class="download-btn" onclick="event.stopPropagation(); downloadItem('${escapeJs(fullPath)}')" title="下载">⬇</button>
                </div>`;
              }
            }

            listEl.innerHTML = html || '<div class="file-list-loading">空目录</div>';
          })
          .catch(() => {
            listEl.innerHTML =
              '<div class="file-list-loading">加载失败</div>';
          });
      }

      function navigateTo(dir) {
        loadFiles(dir);
      }

      function downloadItem(fullPath) {
        fetchWithAuth(`/download?path=${encodeURIComponent(fullPath)}`)
          .then((r) => r.blob())
          .then((blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fullPath.split("/").pop();
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          })
          .catch(() => {
            alert("下载失败");
          });
      }

      function downloadFile() {
        const filePath = document.getElementById("filePath").value.trim();
        if (!filePath) {
          alert("请输入文件路径");
          return;
        }
        fetchWithAuth(`/download?path=${encodeURIComponent(filePath)}`)
          .then((r) => r.blob())
          .then((blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filePath.split("/").pop();
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          })
          .catch(() => {
            alert("下载失败");
          });
      }

      function pathDir(fullPath) {
        const idx = fullPath.lastIndexOf("/");
        return idx > 0 ? fullPath.substring(0, idx) : "/";
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeJs(str) {
        return str.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
      }

      // ── startup: check existing token ──
      (function () {
        const token = getToken();
        if (token) {
          fetchWithAuth("/api/files?dir=")
            .then(() => showApp())
            .catch(() => showLogin());
        } else {
          showLogin();
        }
      })();
    </script>
  </body>
</html>
