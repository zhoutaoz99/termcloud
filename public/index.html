<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Linux Console</title>

    <link
      rel="stylesheet"
      href="/vendor/xterm.css"
    />

    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <div id="login-overlay">
      <div id="login-box">
        <div class="dialog-kicker">TermCloud</div>
        <h2>Web Linux Console</h2>
        <form id="login-form">
          <label for="login-username">用户名</label>
          <input type="text" id="login-username" autocomplete="username" required />
          <label for="login-password">密码</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
          <button type="submit">登 录</button>
        </form>
        <div id="login-error"></div>
      </div>
    </div>

    <div id="claude-config-overlay" style="display:none">
      <div id="claude-config-box">
        <div class="dialog-kicker">运行环境</div>
        <h2>Claude Code 配置</h2>
        <form id="claude-config-form">
          <label for="cc-base-url">ANTHROPIC_BASE_URL <span class="required">*</span></label>
          <input type="text" id="cc-base-url" value="https://api.poe.com" required />
          <label for="cc-auth-token">ANTHROPIC_AUTH_TOKEN <span class="required">*</span></label>
          <input type="password" id="cc-auth-token" placeholder="输入 Auth Token" required />
          <label for="cc-model">ANTHROPIC_MODEL</label>
          <select id="cc-model">
            <option value="">-- 不设置 --</option>
            <option value="deepseek-v4-pro[1m]">deepseek-v4-pro[1m]</option>
          </select>
          <label for="cc-haiku-model">ANTHROPIC_DEFAULT_HAIKU_MODEL</label>
          <select id="cc-haiku-model">
            <option value="">-- 不设置 --</option>
            <option value="deepseek-v4-flash">deepseek-v4-flash</option>
          </select>
          <label for="cc-effort">CLAUDE_CODE_EFFORT_LEVEL</label>
          <select id="cc-effort">
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max" selected>max</option>
          </select>
          <button type="submit">保存并进入</button>
          <button type="button" class="poe-skip-btn">跳过</button>
        </form>
        <div id="claude-config-error"></div>
      </div>
    </div>

    <div id="public-env-overlay" style="display:none">
      <div id="public-env-box">
        <div class="dialog-kicker">管理员</div>
        <h2>公共环境变量</h2>
        <form id="public-env-form">
          <label for="public-env-text">export KEY=VALUE</label>
          <textarea id="public-env-text" spellcheck="false" placeholder="export ANTHROPIC_BASE_URL=&quot;https://api.poe.com&quot;&#10;export ANTHROPIC_AUTH_TOKEN=&quot;$POE_API_KEY&quot;&#10;export ANTHROPIC_API_KEY=&quot;&quot; # Important: Must be explicitly empty">export ANTHROPIC_BASE_URL="https://api.poe.com"
export ANTHROPIC_AUTH_TOKEN="$POE_API_KEY"
export ANTHROPIC_API_KEY="" # Important: Must be explicitly empty</textarea>
          <button type="submit">保存</button>
          <button type="button" class="public-env-close-btn">关闭</button>
        </form>
        <div id="public-env-error"></div>
      </div>
    </div>

    <div id="plugin-overlay" style="display:none">
      <div id="plugin-box">
        <div class="dialog-kicker">扩展</div>
        <h2>插件安装</h2>
        <div class="plugin-item">
          <div class="plugin-info">
            <span class="plugin-name">Claude Code</span>
            <span class="plugin-desc">Anthropic 官方 CLI 工具</span>
          </div>
          <button class="plugin-install-action" data-cmd="npm install -g @anthropic-ai/claude-code">安装</button>
        </div>
        <button type="button" class="plugin-close-btn">关闭</button>
      </div>
    </div>

    <div id="app-container" style="display:none">
      <div id="sidebar">
        <div id="sidebar-titlebar">
          <div class="brand-mark">TC</div>
          <div class="brand-copy">
            <span class="brand-name">TermCloud</span>
            <span class="brand-subtitle">Web Linux Console</span>
          </div>
        </div>
        <div id="sidebar-header">
          <div class="path-stack">
            <span class="section-label">文件</span>
            <span class="path-text" id="current-path">/</span>
          </div>
          <button id="refresh-btn" title="刷新文件列表" aria-label="刷新文件列表">⟳</button>
        </div>
        <div id="file-list">
          <div class="file-list-loading">加载中...</div>
        </div>
        <div id="sidebar-footer">
          <button id="claude-config-btn" title="配置 Claude Code">⚙ Claude Code 配置</button>
          <button id="public-env-btn" title="公共环境变量" style="display:none">◇ 公共环境变量</button>
          <button id="plugin-install-btn" title="安装插件">▣ 插件安装</button>
        </div>

      </div>

      <div id="main-area">
        <div id="workspace-topbar">
          <div class="terminal-title">
            <span class="terminal-glyph">⌁</span>
            <span>终端</span>
          </div>
          <div id="connection-status" class="connection-status is-idle">
            <span class="status-dot"></span>
            <span id="connection-status-text">未连接</span>
          </div>
        </div>
        <div id="terminal-panel">
          <div id="terminal"></div>
        </div>
      </div>
    </div>

    <script defer src="/vendor/xterm.js"></script>
    <script defer src="/vendor/addon-fit.js"></script>
    <script defer src="/vendor/addon-unicode11.js"></script>
    <script defer src="/client.js"></script>
  </body>
</html>
