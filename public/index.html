<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Linux Console</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm/css/xterm.css"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #111;
        font-family: sans-serif;
        overflow: hidden;
      }

      #app-container {
        display: flex;
        width: 100%;
        height: 100%;
      }

      /* ── sidebar ── */
      #sidebar {
        width: 260px;
        min-width: 0;
        background: #1a1a2e;
        color: #ccc;
        display: flex;
        flex-direction: column;
        transition: width 0.25s ease;
        overflow: hidden;
        border-right: 1px solid #333;
      }

      #sidebar.hidden {
        width: 0;
        border-right: none;
      }

      #sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        background: #16213e;
        flex-shrink: 0;
      }

      #sidebar-header .path-text {
        font-size: 12px;
        color: #aaa;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }

      #sidebar-header button {
        background: none;
        border: none;
        color: #aaa;
        cursor: pointer;
        font-size: 16px;
        padding: 0 4px;
        line-height: 1;
      }

      #sidebar-header button:hover {
        color: #fff;
      }

      #file-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }

      #file-list::-webkit-scrollbar {
        width: 5px;
      }

      #file-list::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 3px;
      }

      .file-item {
        display: flex;
        align-items: center;
        padding: 6px 10px;
        cursor: pointer;
        gap: 8px;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .file-item:hover {
        background: #0f3460;
      }

      .file-item .icon {
        flex-shrink: 0;
        width: 18px;
        text-align: center;
        font-size: 14px;
      }

      .file-item .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .file-item .download-btn {
        flex-shrink: 0;
        background: none;
        border: none;
        color: #5fa8d3;
        cursor: pointer;
        font-size: 15px;
        padding: 0 2px;
        opacity: 0;
        transition: opacity 0.15s;
      }

      .file-item:hover .download-btn {
        opacity: 1;
      }

      .file-item .download-btn:hover {
        color: #7ec8e3;
      }

      /* manual path input at bottom of sidebar */
      #sidebar-footer {
        display: flex;
        gap: 6px;
        padding: 8px 10px;
        background: #16213e;
        flex-shrink: 0;
        border-top: 1px solid #333;
      }

      #sidebar-footer input {
        flex: 1;
        padding: 4px 8px;
        border: 1px solid #333;
        border-radius: 3px;
        background: #0e0e1a;
        color: #ccc;
        font-size: 12px;
        min-width: 0;
      }

      #sidebar-footer button {
        padding: 4px 10px;
        background: #0f3460;
        border: none;
        border-radius: 3px;
        color: #ddd;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
      }

      #sidebar-footer button:hover {
        background: #1a4a8a;
      }

      /* ── main area ── */
      #main-area {
        flex: 1;
        display: flex;
        position: relative;
        min-width: 0;
      }

      #toggle-btn {
        position: absolute;
        left: 4px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        background: #1a1a2e;
        border: 1px solid #333;
        border-left: none;
        border-radius: 0 4px 4px 0;
        color: #aaa;
        cursor: pointer;
        font-size: 14px;
        padding: 8px 5px;
        display: none;
        transition: color 0.15s;
      }

      #toggle-btn:hover {
        color: #fff;
      }

      #sidebar.hidden ~ #main-area #toggle-btn {
        display: block;
      }

      #terminal {
        width: 100%;
        height: 100%;
      }

      /* loading state */
      .file-list-loading {
        text-align: center;
        padding: 20px;
        color: #555;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div id="app-container">
      <div id="sidebar">
        <div id="sidebar-header">
          <span class="path-text" id="current-path">/</span>
          <button onclick="toggleSidebar()" title="隐藏侧栏">◀</button>
        </div>
        <div id="file-list">
          <div class="file-list-loading">加载中...</div>
        </div>
        <div id="sidebar-footer">
          <input id="filePath" placeholder="输入路径下载文件" />
          <button onclick="downloadFile()">下载</button>
        </div>
      </div>

      <div id="main-area">
        <button id="toggle-btn" onclick="toggleSidebar()" title="显示文件栏">▶</button>
        <div id="terminal"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit/lib/addon-fit.js"></script>

    <script>
      // ── terminal setup ──
      const terminal = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: "monospace",
        scrollback: 5000,
        convertEol: true,
        theme: {
          background: "#111111"
        }
      });

      const fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);

      terminal.open(document.getElementById("terminal"));
      fitAddon.fit();
      terminal.focus();

      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${protocol}//${location.host}/ws/terminal`);

      socket.onopen = () => {
        terminal.writeln("Connected to Linux server\r\n");

        const dims = fitAddon.proposeDimensions();
        if (dims) {
          socket.send(
            JSON.stringify({
              type: "resize",
              cols: dims.cols,
              rows: dims.rows
            })
          );
        }
      };

      socket.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "output") {
          terminal.write(msg.data);
        }
      };

      socket.onclose = () => {
        terminal.writeln("\r\nConnection closed");
      };

      terminal.onData((data) => {
        socket.send(
          JSON.stringify({
            type: "input",
            data
          })
        );
      });

      function fitTerminal() {
        fitAddon.fit();
        const dims = fitAddon.proposeDimensions();
        if (dims && socket.readyState === WebSocket.OPEN) {
          socket.send(
            JSON.stringify({
              type: "resize",
              cols: dims.cols,
              rows: dims.rows
            })
          );
        }
      }

      window.addEventListener("resize", fitTerminal);

      // ── sidebar toggle ──
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("hidden");
        // refit terminal after transition
        setTimeout(fitTerminal, 300);
      }

      // ── file browser ──
      let currentDir = "";

      function loadFiles(dir) {
        const listEl = document.getElementById("file-list");
        listEl.innerHTML = '<div class="file-list-loading">加载中...</div>';

        fetch(`/api/files?dir=${encodeURIComponent(dir)}`)
          .then((r) => r.json())
          .then((data) => {
            currentDir = data.dir;
            document.getElementById("current-path").textContent = data.dir;

            let html = "";

            // parent directory entry
            if (data.dir !== "/") {
              html += `<div class="file-item" onclick="navigateTo('${escapeJs(data.dir)}/..')">
                <span class="icon">📁</span>
                <span class="name">..</span>
                <span></span>
              </div>`;
            }

            // sort: directories first, then files
            const sorted = data.entries.sort((a, b) => {
              if (a.isDirectory !== b.isDirectory)
                return a.isDirectory ? -1 : 1;
              return a.name.localeCompare(b.name);
            });

            for (const entry of sorted) {
              if (entry.isDirectory) {
                const fullPath = `${data.dir}/${entry.name}`.replace(/\/+/g, "/");
                html += `<div class="file-item" onclick="navigateTo('${escapeJs(fullPath)}')">
                  <span class="icon">📁</span>
                  <span class="name">${escapeHtml(entry.name)}</span>
                  <span></span>
                </div>`;
              } else {
                const fullPath = `${data.dir}/${entry.name}`.replace(/\/+/g, "/");
                html += `<div class="file-item" onclick="navigateTo('${escapeJs(pathDir(fullPath))}')">
                  <span class="icon">📄</span>
                  <span class="name">${escapeHtml(entry.name)}</span>
                  <button class="download-btn" onclick="event.stopPropagation(); downloadItem('${escapeJs(fullPath)}')" title="下载">⬇</button>
                </div>`;
              }
            }

            listEl.innerHTML = html || '<div class="file-list-loading">空目录</div>';
          })
          .catch(() => {
            listEl.innerHTML =
              '<div class="file-list-loading">加载失败</div>';
          });
      }

      function navigateTo(dir) {
        loadFiles(dir);
      }

      function downloadItem(fullPath) {
        window.open(`/download?path=${encodeURIComponent(fullPath)}`, "_blank");
      }

      function downloadFile() {
        const filePath = document.getElementById("filePath").value.trim();
        if (!filePath) {
          alert("请输入文件路径");
          return;
        }
        window.open(`/download?path=${encodeURIComponent(filePath)}`, "_blank");
      }

      function pathDir(fullPath) {
        const idx = fullPath.lastIndexOf("/");
        return idx > 0 ? fullPath.substring(0, idx) : "/";
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeJs(str) {
        return str.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
      }

      // initial load
      loadFiles("");
    </script>
  </body>
</html>
