<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Linux Console</title>

    <link
      rel="stylesheet"
      href="/vendor/xterm.css"
    />

    <style>
      /* Split ASCII and CJK/fullwidth into separate font sources via unicode-range,
         so per-character fallback can no longer pick a Western font for CJK
         punctuation and render it at the wrong width (which misaligns markdown
         tables in xterm.js). */
      @font-face {
        font-family: "TermMono";
        src: local("ui-monospace"), local("SFMono-Regular"), local("SF Mono"),
             local("Menlo"), local("Monaco"), local("Consolas"),
             local("Liberation Mono"), local("DejaVu Sans Mono");
        unicode-range: U+0000-024F, U+2000-22FF;
      }
      @font-face {
        font-family: "TermMono";
        /* Catch-all for characters not covered by the ASCII @font-face above.
           CJK monospace fonts first (each glyph is exactly 2× ASCII width,
           keeping markdown tables aligned in xterm.js); proportional CJK fonts
           are last-resort fallbacks only. */
        src: local("Sarasa Mono SC"), local("Sarasa Fixed SC"),
             local("Noto Sans Mono CJK SC"), local("Source Han Mono SC"),
             local("WenQuanYi Micro Hei Mono"),
             local("PingFang SC"), local("Hiragino Sans GB"),
             local("Microsoft YaHei"), local("SimHei"), local("SimSun");
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #111;
        font-family: sans-serif;
        overflow: hidden;
      }

      /* ── login overlay ── */
      #login-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      #login-box {
        background: #1a1a2e;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 36px 32px;
        width: 340px;
        box-sizing: border-box;
      }

      #login-box h2 {
        margin: 0 0 24px;
        color: #ddd;
        font-size: 20px;
        text-align: center;
        font-weight: 500;
      }

      #login-box label {
        display: block;
        color: #aaa;
        font-size: 13px;
        margin-bottom: 4px;
      }

      #login-box input[type="text"],
      #login-box input[type="password"] {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 16px;
        border: 1px solid #333;
        border-radius: 4px;
        background: #0e0e1a;
        color: #ddd;
        font-size: 14px;
        box-sizing: border-box;
        outline: none;
      }

      #login-box input[type="text"]:focus,
      #login-box input[type="password"]:focus {
        border-color: #0f3460;
      }

      #login-box button[type="submit"] {
        width: 100%;
        padding: 10px;
        background: #0f3460;
        border: none;
        border-radius: 4px;
        color: #ddd;
        font-size: 14px;
        cursor: pointer;
        margin-top: 4px;
      }

      #login-box button[type="submit"]:hover {
        background: #1a4a8a;
      }

      #login-error {
        color: #e74c3c;
        font-size: 13px;
        text-align: center;
        margin-top: 12px;
        min-height: 18px;
      }

      #app-container {
        display: flex;
        width: 100%;
        height: 100%;
      }

      /* ── sidebar ── */
      #sidebar {
        width: 260px;
        min-width: 0;
        background: #1a1a2e;
        color: #ccc;
        display: flex;
        flex-direction: column;
        transition: width 0.25s ease;
        overflow: hidden;
        border-right: 1px solid #333;
      }

      #sidebar.hidden {
        width: 0;
        border-right: none;
      }

      #sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        background: #16213e;
        flex-shrink: 0;
      }

      #sidebar-header .path-text {
        font-size: 12px;
        color: #aaa;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }

      #sidebar-header button {
        background: none;
        border: none;
        color: #aaa;
        cursor: pointer;
        font-size: 16px;
        padding: 0 4px;
        line-height: 1;
      }

      #sidebar-header button:hover {
        color: #fff;
      }

      #file-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }

      #file-list::-webkit-scrollbar {
        width: 5px;
      }

      #file-list::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 3px;
      }

      .file-item {
        display: flex;
        align-items: center;
        padding: 6px 10px;
        cursor: pointer;
        gap: 8px;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .file-item:hover {
        background: #0f3460;
      }

      .file-item .icon {
        flex-shrink: 0;
        width: 18px;
        text-align: center;
        font-size: 14px;
      }

      .file-item .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .file-item .download-btn {
        flex-shrink: 0;
        background: none;
        border: none;
        color: #5fa8d3;
        cursor: pointer;
        font-size: 15px;
        padding: 0 2px;
        opacity: 0;
        transition: opacity 0.15s;
      }

      .file-item .delete-btn {
        flex-shrink: 0;
        background: none;
        border: none;
        color: #e05555;
        cursor: pointer;
        font-size: 15px;
        padding: 0 2px;
        opacity: 0;
        transition: opacity 0.15s;
      }

      .file-item:hover .download-btn,
      .file-item:hover .delete-btn {
        opacity: 1;
      }

      .file-item .download-btn:hover {
        color: #7ec8e3;
      }

      .file-item .delete-btn:hover {
        color: #ff6b6b;
      }

      /* ── main area ── */
      #main-area {
        flex: 1;
        display: flex;
        position: relative;
        min-width: 0;
      }

      #toggle-btn {
        position: absolute;
        left: 4px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        background: #1a1a2e;
        border: 1px solid #333;
        border-left: none;
        border-radius: 0 4px 4px 0;
        color: #aaa;
        cursor: pointer;
        font-size: 14px;
        padding: 8px 5px;
        display: none;
        transition: color 0.15s;
      }

      #toggle-btn:hover {
        color: #fff;
      }

      #sidebar.hidden ~ #main-area #toggle-btn {
        display: block;
      }

      #terminal {
        width: 100%;
        height: 100%;
        font-variant-ligatures: none;
        font-feature-settings:
          "liga" 0,
          "calt" 0;
      }

      #terminal .xterm,
      #terminal .xterm-rows {
        font-variant-ligatures: none;
        font-feature-settings:
          "liga" 0,
          "calt" 0;
      }

      /* loading state */
      .file-list-loading {
        text-align: center;
        padding: 20px;
        color: #555;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div id="login-overlay">
      <div id="login-box">
        <h2>Web Linux Console</h2>
        <form id="login-form" onsubmit="handleLogin(event)">
          <label for="login-username">用户名</label>
          <input type="text" id="login-username" autocomplete="username" required />
          <label for="login-password">密码</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
          <button type="submit">登 录</button>
        </form>
        <div id="login-error"></div>
      </div>
    </div>

    <div id="app-container" style="display:none">
      <div id="sidebar">
        <div id="sidebar-header">
          <span class="path-text" id="current-path">/</span>
          <button onclick="refreshFiles()" title="刷新文件列表">🔄</button>
          <button onclick="toggleSidebar()" title="隐藏侧栏">◀</button>
        </div>
        <div id="file-list">
          <div class="file-list-loading">加载中...</div>
        </div>

      </div>

      <div id="main-area">
        <button id="toggle-btn" onclick="toggleSidebar()" title="显示文件栏">▶</button>
        <div id="terminal"></div>
      </div>
    </div>

    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/vendor/addon-unicode11.js"></script>

    <script>
      // ── auth helpers ──
      function getToken() {
        return localStorage.getItem("token");
      }

      function setToken(token) {
        localStorage.setItem("token", token);
      }

      function clearToken() {
        localStorage.removeItem("token");
      }

      function showLogin() {
        document.getElementById("login-overlay").style.display = "flex";
        document.getElementById("app-container").style.display = "none";
      }

      function showApp() {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("app-container").style.display = "flex";
        initTerminal();
        loadFiles("");
      }

      function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById("login-username").value;
        const password = document.getElementById("login-password").value;
        const errorEl = document.getElementById("login-error");
        errorEl.textContent = "";

        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.token) {
              setToken(data.token);
              showApp();
            } else {
              errorEl.textContent = data.error || "登录失败";
            }
          })
          .catch(() => {
            errorEl.textContent = "网络错误";
          });
      }

      function fetchWithAuth(url, options) {
        const token = getToken();
        const headers = Object.assign({}, options && options.headers, {
          Authorization: "Bearer " + token
        });
        return fetch(url, Object.assign({}, options, { headers })).then((r) => {
          if (r.status === 401) {
            clearToken();
            showLogin();
            throw new Error("unauthorized");
          }
          return r;
        });
      }

      // ── terminal setup ──
      const MSG_OUTPUT = 0x01;
      const MSG_INPUT = 0x02;
      const MSG_RESIZE = 0x03;
      const MSG_CONNECTED = 0x04;
      const MSG_BATCH_OUTPUT = 0x05;

      let terminalInitialized = false;
      let socket = null;
      const terminalFontFamily = '"TermMono", monospace';
      const textDecoder = new TextDecoder();
      const textEncoder = new TextEncoder();

      // write batching: collect output and flush once per animation frame
      let writeBuffer = [];
      let writeFlushScheduled = false;

      function flushWriteBuffer() {
        if (writeBuffer.length > 0) {
          terminal.write(writeBuffer.join(""));
          writeBuffer = [];
        }
        writeFlushScheduled = false;
      }

      function pushOutput(data) {
        writeBuffer.push(data);
        if (!writeFlushScheduled) {
          writeFlushScheduled = true;
          requestAnimationFrame(flushWriteBuffer);
        }
      }

      const terminal = new Terminal({
        allowProposedApi: true,
        cursorBlink: true,
        fontSize: 14,
        fontFamily: terminalFontFamily,
        letterSpacing: 0,
        lineHeight: 1.2,
        rescaleOverlappingGlyphs: true,
        scrollback: 5000,
        theme: {
          background: "#111111"
        }
      });

      const fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);
      if (window.Unicode11Addon) {
        terminal.loadAddon(new Unicode11Addon.Unicode11Addon());
        terminal.unicode.activeVersion = "11";
      }

      function initTerminal() {
        if (terminalInitialized) return;
        terminalInitialized = true;

        terminal.open(document.getElementById("terminal"));
        fitAddon.fit();
        terminal.focus();
        refitTerminalAfterFontsLoad();

        connectWebSocket();
      }

      function connectWebSocket() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const token = getToken();
        socket = new WebSocket(
          `${protocol}//${location.host}/ws/terminal?token=${token}`
        );
        socket.binaryType = "arraybuffer";

        socket.onopen = () => {
          const dims = fitAddon.proposeDimensions();
          if (dims) {
            sendResize(dims.cols, dims.rows);
          }
        };

        socket.onmessage = (event) => {
          const view = new Uint8Array(event.data);
          if (view.length < 1) return;
          const msgType = view[0];
          const payload = textDecoder.decode(view.subarray(1));

          if (msgType === MSG_CONNECTED) {
            const resuming = view.length > 1 && view[1] === 0x01;
            if (!resuming) {
              terminal.writeln("Connected to Linux server\r\n");
            }
            return;
          }

          if (msgType === MSG_OUTPUT || msgType === MSG_BATCH_OUTPUT) {
            pushOutput(payload);
          }
        };

        socket.onclose = (event) => {
          if (event.code === 4001 || event.code === 4003) {
            clearToken();
            showLogin();
          } else {
            terminal.writeln("\r\nConnection lost, reconnecting...");
            setTimeout(() => {
              if (getToken()) connectWebSocket();
            }, 2000);
          }
        };

        socket.onerror = () => {
          terminal.writeln("\r\nConnection error");
        };

        terminal.onData((data) => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            const payload = textEncoder.encode(data);
            const frame = new Uint8Array(1 + payload.length);
            frame[0] = MSG_INPUT;
            frame.set(payload, 1);
            socket.send(frame.buffer);
          }
          if (data === "\r" || data.includes("\r")) {
            scheduleAutoRefresh();
          }
        });

      }

      function sendResize(cols, rows) {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        const frame = new Uint8Array([MSG_RESIZE, cols & 0xFF, cols >> 8, rows & 0xFF, rows >> 8]);
        socket.send(frame.buffer);
      }

      function fitTerminal() {
        fitAddon.fit();
        const dims = fitAddon.proposeDimensions();
        if (dims) {
          sendResize(dims.cols, dims.rows);
        }
      }

      function refitTerminalAfterFontsLoad() {
        if (!document.fonts || !document.fonts.load) {
          return;
        }

        // Force-activate both unicode-range @font-face blocks for "TermMono"
        // before xterm.js measures the cell width, so the CJK @font-face
        // takes effect from the first render.
        const probes = [
          document.fonts.load('14px "TermMono"', "Aa"),
          document.fonts.load('14px "TermMono"', "中，。：（）")
        ];

        Promise.allSettled(probes).then(() => {
          fitTerminal();
          terminal.refresh(0, terminal.rows - 1);
        });
      }

      window.addEventListener("resize", fitTerminal);

      // ── sidebar toggle ──
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("hidden");
        // refit terminal after transition
        setTimeout(fitTerminal, 300);
      }

      // ── file browser ──
      let currentDir = "";

      function loadFiles(dir) {
        const listEl = document.getElementById("file-list");
        listEl.innerHTML = '<div class="file-list-loading">加载中...</div>';

        fetchWithAuth(`/api/files?dir=${encodeURIComponent(dir)}`)
          .then((r) => r.json())
          .then((data) => {
            currentDir = data.dir;
            document.getElementById("current-path").textContent = data.dir;

            const fragment = document.createDocumentFragment();

            if (data.dir !== data.workDir) {
              fragment.appendChild(createFileItemParent(data.dir));
            }

            const sorted = data.entries.sort((a, b) => {
              if (a.isDirectory !== b.isDirectory)
                return a.isDirectory ? -1 : 1;
              return a.name.localeCompare(b.name);
            });

            for (const entry of sorted) {
              const fullPath = `${data.dir}/${entry.name}`.replace(/\/+/g, "/");
              fragment.appendChild(createFileItem(entry, fullPath, data.dir));
            }

            listEl.replaceChildren(fragment.hasChildNodes() ? fragment : createEmptyMessage("空目录"));
          })
          .catch(() => {
            listEl.replaceChildren(createEmptyMessage("加载失败"));
          });
      }

      function createEmptyMessage(text) {
        const div = document.createElement("div");
        div.className = "file-list-loading";
        div.textContent = text;
        return div;
      }

      function createFileItemParent(parentDir) {
        const item = document.createElement("div");
        item.className = "file-item";
        item.innerHTML = '<span class="icon">📁</span><span class="name">..</span>';
        item.addEventListener("click", () => navigateTo(parentDir));
        return item;
      }

      function createFileItem(entry, fullPath, parentDir) {
        const item = document.createElement("div");
        item.className = "file-item";

        const icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = entry.isDirectory ? "📁" : "📄";
        item.appendChild(icon);

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = entry.name;
        item.appendChild(name);

        if (entry.isDirectory) {
          item.addEventListener("click", () => navigateTo(fullPath));
        } else {
          item.addEventListener("click", () => navigateTo(pathDir(fullPath)));

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-btn";
          deleteBtn.title = "删除";
          deleteBtn.textContent = "✕";
          deleteBtn.addEventListener("click", (e) => { e.stopPropagation(); deleteItem(fullPath); });
          item.appendChild(deleteBtn);

          const downloadBtn = document.createElement("button");
          downloadBtn.className = "download-btn";
          downloadBtn.title = "下载";
          downloadBtn.textContent = "⬇";
          downloadBtn.addEventListener("click", (e) => { e.stopPropagation(); downloadItem(fullPath); });
          item.appendChild(downloadBtn);
        }

        return item;
      }

      function navigateTo(dir) {
        loadFiles(dir);
      }

      function refreshFiles() {
        loadFiles(currentDir);
      }

      let refreshDebounce = null;
      function scheduleAutoRefresh() {
        if (refreshDebounce) clearTimeout(refreshDebounce);
        refreshDebounce = setTimeout(() => {
          const sidebar = document.getElementById("sidebar");
          if (!sidebar.classList.contains("hidden")) {
            loadFiles(currentDir);
          }
        }, 1000);
      }

      function downloadItem(fullPath) {
        fetchWithAuth(`/download?path=${encodeURIComponent(fullPath)}`)
          .then((r) => r.blob())
          .then((blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fullPath.split("/").pop();
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          })
          .catch(() => {
            alert("下载失败");
          });
      }

      function deleteItem(fullPath) {
        const name = fullPath.split("/").pop();
        if (!confirm(`确定删除 ${name} 吗？`)) return;
        fetchWithAuth(`/api/files?path=${encodeURIComponent(fullPath)}`, { method: "DELETE" })
          .then((r) => {
            if (!r.ok) return r.json().then((e) => { throw new Error(e.error); });
            loadFiles(currentDir);
          })
          .catch((err) => {
            alert("删除失败: " + err.message);
          });
      }

      function pathDir(fullPath) {
        const idx = fullPath.lastIndexOf("/");
        return idx > 0 ? fullPath.substring(0, idx) : "/";
      }

      // ── startup: check existing token ──
      (function () {
        const token = getToken();
        if (token) {
          fetchWithAuth("/api/files?dir=")
            .then(() => showApp())
            .catch(() => showLogin());
        } else {
          showLogin();
        }
      })();
    </script>
  </body>
</html>
